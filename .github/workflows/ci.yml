name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Format & lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.23.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: npm install -g npm@12.0.2

      - run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

  test:
    name: Build, typecheck & test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.23.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: npm install -g npm@12.0.2

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (Vitest on Node)
        run: pnpm test

      - name: Lint published artifacts (publint)
        run: pnpm publint

      # Slow-types across all packages are enforced by `isolatedDeclarations`
      # in the build + typecheck steps above. This dry-run additionally
      # validates the JSR toolchain + generated jsr.json end-to-end on `core`
      # (the dependency-free package — dependent packages cannot fully
      # publish-simulate until their `jsr:@panqueue/*` siblings exist on JSR).
      - name: JSR publish dry-run (core)
        run: |
          pnpm gen:jsr
          cd packages/core && npx jsr publish --dry-run --allow-dirty
